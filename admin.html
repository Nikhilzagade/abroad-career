<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abroad Career Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#050912;
color:#fff;
padding:40px;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
font-size:42px;
margin-bottom:30px;
font-weight:800;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:30px;
}

.card{
background:linear-gradient(135deg,#0f1729,#121d34);
border:1px solid rgba(255,255,255,0.08);
border-radius:20px;
padding:25px;
}

.label{
font-size:14px;
color:#9ca3af;
margin-bottom:12px;
}

.value{
font-size:42px;
font-weight:800;
color:#d4af37;
}

.section{
background:#0f1729;
border:1px solid rgba(255,255,255,0.08);
border-radius:20px;
padding:25px;
margin-bottom:25px;
}

.section h2{
margin-bottom:20px;
font-size:24px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
text-align:left;
padding:16px;
color:#9ca3af;
font-weight:600;
border-bottom:1px solid rgba(255,255,255,0.08);
}

td{
padding:16px;
border-bottom:1px solid rgba(255,255,255,0.05);
}

tr:hover{
background:rgba(255,255,255,0.03);
}

.badge{
display:inline-block;
padding:8px 12px;
background:rgba(212,175,55,0.15);
color:#d4af37;
border-radius:999px;
font-size:12px;
font-weight:600;
}

.challenge-list{
display:grid;
gap:12px;
}

.challenge-item{
display:flex;
justify-content:space-between;
padding:14px;
background:#121d34;
border-radius:12px;
}

@media(max-width:1000px){

.grid{
grid-template-columns:1fr 1fr;
}

}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Abroad Career Dashboard</h1>

<div class="grid">

<div class="card">
<div class="label">Total Signups</div>
<div class="value" id="totalSignups">0</div>
</div>

<div class="card">
<div class="label">Unique Professions</div>
<div class="value" id="totalProfessions">0</div>
</div>

<div class="card">
<div class="label">Challenge Types</div>
<div class="value" id="totalChallenges">0</div>
</div>

<div class="card">
<div class="label">Today's Signups</div>
<div class="value" id="todaySignups">0</div>
</div>

</div>

<div class="section">

<h2>Challenge Breakdown</h2>

<div class="challenge-list" id="challengeBreakdown">

</div>

</div>

<div class="section">

<h2>Latest Signups</h2>

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Profession</th>
<th>Challenge</th>
<th>Date</th>
</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script>

const SUPABASE_URL='https://qpnygezdhmzhwsgpfleh.supabase.co';
const SUPABASE_KEY='sb_publishable_DPAyuzmWDYi5wZWAcLiVkA_Pfbwcn42';

const supabase=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

loadDashboard();

async function loadDashboard(){
const { data, error } = await supabase
  .from('waitlist')
  .select('*');

console.log('DATA:', data);
console.log('ERROR:', error);
}

document.getElementById('totalSignups').innerText=data.length;

const professions=[
...new Set(data.map(x=>x.profession))
];

document.getElementById('totalProfessions').innerText=
professions.length;

const challenges=[
...new Set(data.map(x=>x.challenge))
];

document.getElementById('totalChallenges').innerText=
challenges.length;

const today=new Date().toDateString();

const todayCount=data.filter(x=>
new Date(x.created_at).toDateString()===today
).length;

document.getElementById('todaySignups').innerText=
todayCount;

const challengeMap={};

data.forEach(row=>{

if(!challengeMap[row.challenge]){
challengeMap[row.challenge]=0;
}

challengeMap[row.challenge]++;

});

const challengeDiv=
document.getElementById('challengeBreakdown');

Object.entries(challengeMap)
.sort((a,b)=>b[1]-a[1])
.forEach(item=>{

challengeDiv.innerHTML+=`
<div class="challenge-item">
<span>${item[0]}</span>
<span class="badge">${item[1]}</span>
</div>
`;

});

const tableBody=
document.getElementById('tableBody');

data.forEach(row=>{

tableBody.innerHTML+=`

<tr>
<td>${row.name || '-'}</td>
<td>${row.email || '-'}</td>
<td>${row.profession || '-'}</td>
<td>${row.challenge || '-'}</td>
<td>${
row.created_at
? new Date(row.created_at).toLocaleDateString()
: '-'
}</td>
</tr>

`;

});

}

</script>

</body>
</html>
